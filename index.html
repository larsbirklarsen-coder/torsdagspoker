<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torsdagspoker</title>
<meta name="theme-color" content="#0f4d34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Torsdagspoker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: grøn filt-bånd øverst med titel og faner, derunder én smal kolonne med kort og tabeller. */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --ink:#16201b; --muted:#5b6a62; --line:#d6ddd7;
  --band:#0f4d34; --band-ink:#f4f8f5; --band-muted:#a9c9b8;
  --accent:#0f6a45; --accent-ink:#ffffff; --gain:#12784a; --loss:#b3261e; --gold:#a8760c; --warn-bg:#fdf3dc; --warn-ink:#7a5408;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --s1:#1f6feb; --s2:#d1470f; --s3:#12784a; --s4:#a8760c; --s5:#8a3ffc; --s6:#c4166c; --s7:#0f8a9d; --s8:#8a958f;
  --s9:#7a4a1e; --s10:#d62f2f; --s11:#6b8e23; --s12:#2f3f9e; --s13:#b05fa0; --s14:#3a7d7a; --s15:#9a6a00;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1310; --surface:#141e19; --ink:#e5ede8; --muted:#92a399; --line:#25332b;
  --band:#0b3324; --band-ink:#eef5f0; --band-muted:#8fb5a1;
  --accent:#43b883; --accent-ink:#06150e; --gain:#4cc28b; --loss:#f07a70; --gold:#e0b04a; --warn-bg:#33270d; --warn-ink:#f1cf7f;
  --s1:#6ea8ff; --s2:#ff8a5c; --s3:#4cc28b; --s4:#e0b04a; --s5:#b28dff; --s6:#ff7eb6; --s7:#4fd1e0; --s8:#7d8b84;
  --s9:#d09a6a; --s10:#ff6b6b; --s11:#a8cc5c; --s12:#8f9dff; --s13:#e29bd4; --s14:#7fcfc9; --s15:#f0c040;
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
header.band .wrap{padding-block:22px 0;display:flex;flex-direction:column;gap:4px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.sub{color:var(--band-muted);font-size:13px}
.login-link{background:none;border:1px solid var(--band-muted);color:var(--band-ink);font-size:13px;padding:6px 10px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:14px}
nav.tabs a{color:var(--band-muted);text-decoration:none;padding:10px 12px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--gold)}
nav.tabs a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main .wrap{padding-block:20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.gain{color:var(--gain);font-weight:600}.loss{color:var(--loss);font-weight:600}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th.num{text-align:right}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.rank{font-family:var(--display);font-size:20px;font-weight:700;width:34px;color:var(--muted)}
tr.lead .rank{color:var(--gold)}
.leader{display:flex;gap:14px;align-items:center}
.chip{width:46px;height:46px;border-radius:50%;flex:none;background:var(--gold);border:5px dashed var(--surface);box-shadow:0 0 0 2px var(--gold)}
.big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:14px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:110px}
button{font:inherit;font-weight:600;border-radius:7px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--loss)}
button:disabled{opacity:.55;cursor:default}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.game{border:1px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ev-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
@media (max-width:520px){.hide-sm{display:none}.tight td,.tight th{padding-inline:5px}}
details.month{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.month>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px;font-weight:600}
details.month>summary::-webkit-details-marker{display:none}
details.month>summary::before{content:"▸";color:var(--muted);margin-right:8px;transition:transform .15s}
details.month[open]>summary::before{transform:rotate(90deg)}
details.month>summary>span:first-child{flex:1}
.month-body{display:flex;flex-direction:column;gap:10px;padding:0 10px 10px}
.month-body .card{border-color:var(--line);background:var(--bg)}
.card.cancelled{opacity:.75}
.chips button{padding:6px 12px;font-size:13px;border-radius:99px}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
i.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.cellbtn{padding:2px 9px;font-variant-numeric:tabular-nums;border-radius:99px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:17px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.h2h td,.h2h th{text-align:center}
.h2h td:first-child,.h2h th:first-child{text-align:left}
.clock{align-items:center;text-align:center;gap:6px;padding-block:22px}
.clock .lvl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.clock .blinds{font-family:var(--display);font-weight:700;font-size:clamp(44px,15vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.clock .time{font-family:var(--display);font-weight:700;font-size:clamp(72px,26vw,168px);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock.warn .time{color:var(--gold)}
.clock.over .time{color:var(--loss)}
.clock.pause .blinds{color:var(--accent)}
.clock .next{color:var(--muted);font-size:15px}
.clock .ctl{justify-content:center;margin-top:10px}
.clock .ctl button{min-width:92px}
.clock .go{min-width:150px!important;font-size:18px;padding:12px 18px}
.bar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.clock.warn .bar>i{background:var(--gold)}
tr.cur td{background:var(--bg);font-weight:600}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:190px;width:100%;font-variant-numeric:tabular-nums}
[data-tab]{display:none;flex-direction:column;gap:14px}[data-tab].on{display:flex}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s}button:hover:not(:disabled){filter:brightness(1.06)}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="top">
      <h1>Torsdagspoker</h1>
      <button class="login-link" id="login-btn" type="button">Log ind</button>
    </div>
    <div class="sub" id="sub">Sit &amp; go hver 14. dag</div>
    <nav class="tabs" id="tabs">
      <a href="#merit" data-link="merit">Order of Merit</a>
      <a href="#aftener" data-link="aftener">Aftener</a>
      <a href="#statistik" data-link="statistik">Statistik</a>
      <a href="#ny" data-link="ny" id="tab-ny">Ny aften</a>
      <a href="#ur" data-link="ur">Blind-ur</a>
      <a href="#regler" data-link="regler">Regler og spillere</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="status" class="notice" hidden></div>
    <section id="login" class="card" hidden></section>
    <section data-tab="merit" id="sec-merit"></section>
    <section data-tab="aftener" id="sec-aftener"></section>
    <section data-tab="statistik" id="sec-statistik"></section>
    <section data-tab="ny" id="sec-ny"></section>
    <section data-tab="ur" id="sec-ur"></section>
    <section data-tab="regler" id="sec-regler"></section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Forbindelse. Publishable/anon-nøglen er offentlig og må gerne stå her – adgangen styres af reglerne i databasen. */
const SB_URL="https://wmmdgdpdejqazrginqgp.supabase.co";
const SB_KEY="sb_publishable_IxWJBCmySse3nCVfv2Oyrw_IRtgn_tR";
const APP_VERSION="2026-11-26.2";   // skal matche version.txt – hæves ved hver udgivelse

const DEFAULTS={buyIn:150,games:2,minPlayers:5,maxPlayers:6,prizes:{"5":[450,300],"6":[450,300,150]},
  blinds:{minutes:12,stack:"10 × 10 · 12 × 25 · 12 × 100 · 1 × 500",
    levels:[[10,20],[20,40],[30,60],[50,100],[75,150],[100,200],[200,400],[400,800],[800,1600]].map(([sb,bb])=>({sb,bb}))}};
const S={sb:null,session:null,admins:[],confirmAdmin:null,settings:null,players:[],evenings:[],canWrite:false,loaded:false,
  season:null,draft:null,editingId:null,confirmDel:null,settingsDirty:false,busy:false,showLogin:false,loginSent:false,
  raw:[],evSeason:null,evQuery:"",evFilter:"alle",openMonths:{},statSeason:null,statShowOld:false,streakInfo:null,restored:false,restore:null};

/* Påbegyndt aften gemmes i telefonen ved hver ændring, så den overlever genindlæsning og opdateringer. */
const DK="tp-draft";
function persistDraft(){try{const d=S.draft;
  if(d&&(d.players.length||d.cancelled||S.editingId))localStorage.setItem(DK,JSON.stringify({draft:d,editingId:S.editingId,at:Date.now()}));
  else localStorage.removeItem(DK)}catch{}}
function clearDraft(){S.draft=null;S.editingId=null;try{localStorage.removeItem(DK)}catch{}}
function hasSavedDraft(){try{return !!localStorage.getItem(DK)}catch{return false}}
function restoreDraft(){try{const x=JSON.parse(localStorage.getItem(DK));
  if(x&&x.draft&&Date.now()-x.at<48*3600e3){S.draft=x.draft;S.editingId=x.editingId||null;return true}
  localStorage.removeItem(DK)}catch{}return false}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("da-DK");
const kr=n=>nf.format(n)+" kr.";
const net=n=>n===0?"0 kr.":(n>0?"+":"−")+nf.format(Math.abs(n))+" kr.";
const netCls=n=>n>0?"gain":n<0?"loss":"";
const fmtDate=d=>{try{return new Date(d+"T12:00").toLocaleDateString("da-DK",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}catch{return d}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const cfg=()=>Object.assign({},DEFAULTS,S.settings||{});
const pname=id=>(S.players.find(p=>p.id===id)||{}).name||"Ukendt";
const writable=()=>S.canWrite===true;
const isGuest=id=>!!(S.players.find(p=>p.id===id)||{}).guest;
const label=p=>esc(p.name)+(p.guest?" (gæst)":"");
const newId=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));

/* De første sæsoner gik fra august til august; sæsonen gemmes som startåret. */
const SEASON_NAMES={2008:"2008-09",2009:"2009-10",2010:"2010-11",2011:"2011-12 lang sæson"};
const sname=y=>SEASON_NAMES[y]||String(y);
const krx=v=>v==null?"–":kr(v);   // ukendt beløb vises som –
function evResult(ev){
  const paid=(ev.buyIn||0)*(ev.gameCount||(ev.games||[]).length);
  /* Regnearket har gæsterne samlet på én linje (kan være flere gæster), så for dem kendes kun netto. */
  if(ev.results)return Object.entries(ev.results).map(([id,n])=>isGuest(id)?{id,paid:null,won:null,wins:0,net:n}:{id,paid,won:n+paid,wins:0,net:n}).sort((a,b)=>b.net-a.net);
  const m={};(ev.players||[]).forEach(p=>m[p]={id:p,paid,won:0,wins:0});
  (ev.games||[]).forEach(g=>g.forEach((p,i)=>{if(m[p]){m[p].won+=(ev.prizes||[])[i]||0;if(i===0)m[p].wins++}}));
  return Object.values(m).map(r=>({...r,net:r.won-r.paid})).sort((a,b)=>b.net-a.net||b.wins-a.wins);
}
const played=e=>!e.cancelled;
const MONTHS=["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];
function seasons(){const y=new Set(S.evenings.map(e=>e.season));y.add(new Date().getFullYear());return [...y].sort((a,b)=>b-a)}
function merit(season){
  const t={};
  S.evenings.filter(e=>e.season===season&&played(e)).forEach(ev=>evResult(ev).forEach(r=>{
    const a=t[r.id]||(t[r.id]={id:r.id,n:0,paid:0,won:0,wins:0,net:0});
    a.n++;a.wins+=r.wins;a.net+=r.net;
    if(r.paid==null||a.paid==null){a.paid=null;a.won=null}else{a.paid+=r.paid;a.won+=r.won}}));
  /* Lige: flest sejre, derefter flest aftener (som i det gamle regneark). */
  return Object.values(t).sort((a,b)=>b.net-a.net||b.wins-a.wins||b.n-a.n);
}
/* Sæsonens top 3 blandt faste spillere (gæster får ingen placering). */
const podium=season=>merit(season).filter(r=>!isGuest(r.id)).slice(0,3);
/* Samlet over alle år + antal 1./2./3.-pladser i afsluttede sæsoner. */
function allTime(){
  const t={},cur=new Date().getFullYear();
  seasons().forEach(y=>{merit(y).forEach(r=>{const a=t[r.id]||(t[r.id]={id:r.id,n:0,net:0,seasons:0,places:[0,0,0]});
    a.n+=r.n;a.net+=r.net;a.seasons++});
    if(y<cur)podium(y).forEach((r,i)=>t[r.id].places[i]++)});
  return Object.values(t).sort((a,b)=>b.net-a.net||b.places[0]-a.places[0]||b.n-a.n);
}
function renderAllTime(el,ss){
  const cur=new Date().getFullYear(),rows=allTime(),done=ss.filter(y=>y<cur);
  const evs=S.evenings.filter(played),first=evs[evs.length-1];
  let h=`<div class="row spread"><h2>Order of Merit · alle år</h2>${seasonSelect(ss)}</div>`;
  if(!rows.length){el.innerHTML=h+`<div class="card empty">Ingen aftener endnu.</div>`;return}
  const lead=rows.find(r=>!isGuest(r.id));
  if(lead)h+=`<div class="card"><div class="leader"><div class="chip" aria-hidden="true"></div><div>
    <div class="small muted">Mest i plus efter ${nf.format(evs.length)} aftener${first?` siden ${esc(fmtDate(first.date))}`:""}</div>
    <div class="big">${esc(pname(lead.id))}</div>
    <div class="${netCls(lead.net)}">${net(lead.net)}</div></div></div></div>`;
  let rank=0;
  h+=`<div class="card"><div class="tbl"><table class="tight"><thead><tr><th></th><th>Spiller</th><th class="num hide-sm">Sæsoner</th><th class="num">Aftener</th><th class="num">I alt</th><th class="num hide-sm">Gns.</th><th class="num" title="Antal 1.-, 2.- og 3.-pladser">1·2·3</th></tr></thead><tbody>
  ${rows.map(r=>{const g=isGuest(r.id);if(!g)rank++;const pl=g?"–":r.places.join(" · ");
    return `<tr class="${!g&&r===lead?"lead":""}"><td class="rank">${g?"–":rank}</td><td>${esc(pname(r.id))}${g?` <span class="pill">Gæst</span>`:""}</td><td class="num hide-sm">${r.seasons}</td><td class="num">${r.n}</td><td class="num ${netCls(r.net)}">${net(r.net)}</td><td class="num muted hide-sm">${(r.net/r.n).toLocaleString("da-DK",{maximumFractionDigits:0})}</td><td class="num">${pl}</td></tr>`}).join("")}
  </tbody></table></div><div class="small muted">I alt = samlet fortjeneste i alle sæsoner. 1·2·3 = antal gange spilleren er sluttet som nr. 1, 2 og 3 i en afsluttet sæson (${done.length} sæsoner). Står to lige, går den med flest aftener foran.</div></div>`;
  h+=`<div class="card"><h3>Årets top 3</h3><div class="tbl"><table class="tight"><thead><tr><th>Sæson</th><th>Vinder</th><th>2.</th><th>3.</th></tr></thead><tbody>
  ${ss.map(y=>{const p=podium(y);if(!p.length)return "";const c=i=>p[i]?`${esc(pname(p[i].id))}<div class="small muted" style="font-weight:400">${net(p[i].net)}</div>`:"";
    return `<tr><td><a href="#merit" data-act="season" data-y="${y}">${esc(sname(y))}</a>${y>=cur?` <span class="pill">i gang</span>`:""}</td><td><b>${c(0)}</b></td><td>${c(1)}</td><td>${c(2)}</td></tr>`}).join("")}
  </tbody></table></div></div>`;
  el.innerHTML=h;
}
const seasonSelect=ss=>`<label style="flex-direction:row;align-items:center;gap:8px">Sæson
    <select id="season"><option value="alle" ${S.season==="alle"?"selected":""}>Alle år</option>${ss.map(y=>`<option value="${y}" ${y===S.season?"selected":""}>${esc(sname(y))}</option>`).join("")}</select></label>`;

/* ---------- Order of Merit ---------- */
function renderMerit(){
  const el=$("#sec-merit");
  if(!S.loaded){el.innerHTML=`<div class="card empty">Henter resultater …</div>`;return}
  const ss=seasons(); if(S.season==="alle")return renderAllTime(el,ss); if(!ss.includes(S.season))S.season=ss[0];
  const rows=merit(S.season);
  const evs=S.evenings.filter(e=>e.season===S.season&&played(e));
  const last=evs[0];
  let h=`<div class="row spread"><h2>Order of Merit ${esc(sname(S.season))}</h2>${seasonSelect(ss)}</div>`;
  if(!rows.length){el.innerHTML=h+`<div class="card empty">Ingen aftener i ${esc(sname(S.season))} endnu.</div>`;return}
  const lead=rows.find(r=>!isGuest(r.id));

    <div class="big">${esc(pname(lead.id))}</div>
    <div class="${netCls(lead.net)}">${net(lead.net)}</div></div></div></div>`;
  let rank=0;
  h+=`<div class="card"><div class="tbl"><table><thead><tr><th></th><th>Spiller</th><th class="num">Aftener</th><th class="num hide-sm">Indskud</th><th class="num hide-sm">Gevinst</th><th class="num">Fortjeneste</th><th class="num">Gns.</th></tr></thead><tbody>
  ${rows.map(r=>{const g=isGuest(r.id);if(!g)rank++;

  </tbody></table></div><div class="small muted">Fortjeneste = gevinst minus indskud. Gns. = fortjeneste pr. aften spillet. Gæster vises, men får ingen placering og kan ikke vinde året.</div></div>`;
  if(last) h+=`<div class="card"><div class="ev-head"><h3>Seneste aften · ${esc(fmtDate(last.date))}</h3><a href="#aftener" class="small">Alle aftener</a></div>${settleTable(last)}</div>`;
  el.innerHTML=h;
}
function settleTable(ev){

/* ---------- Statistik ---------- */
/* Hver spiller har sin egen faste farve i alle grafer og alle år. Gæster er grå. */
const FIXED_COLOR={allan:1,mikael:2,stein:3,ole:4,mikkel:5,lars:6,peter:7,thomas:9,rode:10,casper:11};
const EXTRA_COLORS=[12,13,14,15];
function pcolor(id){
  if(isGuest(id))return "var(--s8)";
  if(FIXED_COLOR[id])return `var(--s${FIXED_COLOR[id]})`;
  const others=S.players.filter(p=>!p.guest&&!FIXED_COLOR[p.id]).map(p=>p.id).sort();
  return `var(--s${EXTRA_COLORS[Math.max(0,others.indexOf(id))%EXTRA_COLORS.length]})`;
}
const pct=x=>Math.round(x*100)+" %";
/* Længste række af aftener i træk i plus (n>0) eller minus (n<0). 0 kr. bryder rækken; aftener man ikke var med, springes over. */
function streak(p,test,evs){
  let best={len:0},cur=0,start=0;
  p.nets.forEach((n,j)=>{if(test(n)){if(!cur)start=j;cur++;if(cur>best.len)best={len:cur,from:evs[p.idx[start]].date,to:evs[p.idx[j]].date}}else cur=0});
  return best;
}
const fmtShort=d=>new Date(d+"T12:00").toLocaleDateString("da-DK",{day:"numeric",month:"short",year:"numeric"});
const shortSeason=y=>sname(y).replace(/^20(\d\d)-(\d\d).*$/,"$1-$2").replace(/^20(\d\d)$/,"$1");
function renderStats(){
  const el=$("#sec-statistik");
  if(!S.loaded){el.innerHTML=`<div class="card empty">Henter statistik …</div>`;return}
  const ss=seasons();if(S.statSeason===null)S.statSeason=String(S.season||ss[0]);
  const all=S.statSeason==="alle";
  const evs=S.evenings.filter(e=>played(e)&&(all||String(e.season)===S.statSeason)).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const cancelled=S.evenings.filter(e=>e.cancelled&&(all||String(e.season)===S.statSeason)).length;
  let h=`<div class="row spread"><h2>Statistik</h2><select id="st-season" aria-label="Sæson"><option value="alle" ${all?"selected":""}>Alle sæsoner</option>${ss.map(y=>`<option value="${y}" ${String(y)===S.statSeason?"selected":""}>${esc(sname(y))}</option>`).join("")}</select></div>`;
  if(!evs.length){el.innerHTML=h+`<div class="card empty">Ingen spillede aftener i perioden.</div>`;return}
  /* pr. spiller */
  const P={};
  evs.forEach((ev,i)=>evResult(ev).forEach(r=>{const p=P[r.id]||(P[r.id]={id:r.id,nets:[],idx:[],hosted:0});p.nets.push(r.net);p.idx.push(i)}));
  evs.forEach(ev=>{if(ev.host&&P[ev.host])P[ev.host].hosted++});
  /* Under "Alle sæsoner" skjules tidligere spillere og gæster, til man beder om dem. */
  const former=id=>{const p=S.players.find(x=>x.id===id);return !p||p.guest||p.active===false};
  const hidden=all?Object.keys(P).filter(former):[];
  const shown=id=>!all||S.statShowOld||!hidden.includes(id);
  const rows=Object.values(P).filter(p=>shown(p.id)).map(p=>{
    const sum=p.nets.reduce((a,b)=>a+b,0);return {...p,n:p.nets.length,sum,plus:p.nets.filter(n=>n>0).length/p.nets.length,
      max:Math.max(...p.nets),min:Math.min(...p.nets),up:streak(p,n=>n>0,evs),down:streak(p,n=>n<0,evs),color:pcolor(p.id)}}).sort((a,b)=>b.sum-a.sum);
  h+=`<div class="row" style="gap:8px"><span class="pill">${evs.length} spillede aftener</span>${cancelled?`<span class="pill">${cancelled} aflyst</span>`:""}<span class="pill">${fmtDate(evs[0].date)} – ${fmtDate(evs[evs.length-1].date)}</span></div>`;
  if(hidden.length)h+=`<div class="row chips"><button data-act="st-old" class="${S.statShowOld?"on":""}">${S.statShowOld?"Skjul":"Vis"} tidligere spillere og gæster (${hidden.length})</button></div>`;
  /* Graf: pr. aften i én sæson, pr. sæson under "Alle sæsoner". */
  let series,n,xlab,title;
  if(all){
    const ys=[...new Set(evs.map(e=>e.season))].sort((a,b)=>a-b);n=ys.length;
    series=rows.map(r=>{let c=0;const pts=[0];ys.forEach(y=>{r.nets.forEach((v,j)=>{if(evs[r.idx[j]].season===y)c+=v});pts.push(c)});return {color:r.color,pts}});
    const every=n>12?3:n>6?2:1;
    xlab=i=>(i===n||(n-i)%every===0)?shortSeason(ys[i-1]):null;
    title="Samlet fortjeneste efter hver sæson";
  }else{
    n=evs.length;series=rows.map(r=>{let c=0,j=0;const pts=[0];evs.forEach((ev,i)=>{if(r.idx[j]===i){c+=r.nets[j];j++}pts.push(c)});return {color:r.color,pts}});
    const at=[1,Math.ceil(n/2),n];xlab=i=>at.includes(i)?(d=>`${d.getDate()}. ${MONTHS[d.getMonth()].slice(0,3)}`)(new Date(evs[i-1].date+"T12:00")):null;
    title="Fortjeneste over tid";
  }
  h+=`<div class="card"><h3>${title}</h3>${chart(n,xlab,series,all)}
    <div class="legend">${rows.map(r=>`<span><i style="background:${r.color}"></i>${esc(pname(r.id))}</span>`).join("")}</div>
    ${all?`<div class="small muted">Hvert punkt er stillingen ved slutningen af en sæson (${esc(sname(evs[0].season))} til ${esc(sname(evs[evs.length-1].season))}). Vælg en sæson for at se de enkelte aftener.</div>`:""}</div>`;
  const info=S.streakInfo&&rows.find(r=>r.id===S.streakInfo.id);
  const sInfo=info?(k=>{const x=info[k];return x.len?`<div class="notice">${esc(pname(info.id))}: ${x.len} ${x.len===1?"aften":"aftener"} i træk i ${k==="up"?"plus":"minus"}${x.len>1?`, fra ${fmtShort(x.from)} til ${fmtShort(x.to)}`:`, ${fmtShort(x.from)}`}.</div>`:""})(S.streakInfo.k):"";
  const sb=(r,k)=>r[k].len?`<button class="cellbtn" data-act="streak" data-id="${esc(r.id)}" data-k="${k}">${r[k].len}</button>`:"0";
  h+=`<div class="card"><h3>Aftener</h3><div class="tbl"><table class="tight"><thead><tr><th>Spiller</th><th class="num">Aftener</th><th class="num">I plus</th><th class="num hide-sm">Bedste</th><th class="num hide-sm">Værste</th><th class="num">Plus<br>i træk</th><th class="num">Minus<br>i træk</th><th class="num hide-sm">Vært</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><i class="dot" style="background:${r.color}"></i>${esc(pname(r.id))}${isGuest(r.id)?` <span class="pill">Gæst</span>`:""}</td><td class="num">${r.n}</td><td class="num">${pct(r.plus)}</td><td class="num gain hide-sm">${net(r.max)}</td><td class="num loss hide-sm">${net(r.min)}</td><td class="num">${sb(r,"up")}</td><td class="num">${sb(r,"down")}</td><td class="num hide-sm">${r.hosted}</td></tr>`).join("")}
    </tbody></table></div>${sInfo}<div class="small muted">I plus = andel af aftenerne med gevinst. Plus i træk = flest aftener i træk med gevinst. Minus i træk = flest aftener i træk med tab. En aften med 0 kr. bryder rækken, og aftener man ikke var med, springes over. Tryk på tallet for at se hvornår.<span class="hide-sm"> Vært = antal aftener som vært.</span></div></div>`;
  /* Placeringer i de enkelte spil tastes fuldt fra 2027 og vises kun for én sæson fra 2027. */
  if(!all&&+S.statSeason>=2027)h+=placeStats(evs);
  el.innerHTML=h;
}
function chart(n,xlab,series,dots){
  const W=700,H=300,L=70,R=14,T=14,B=34;
  let lo=0,hi=0;series.forEach(s=>s.pts.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v)}));
  const step=niceStep((hi-lo)/4||100);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;
  const x=i=>L+(W-L-R)*i/Math.max(1,n),y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let g="";for(let v=lo;v<=hi+0.001;v+=step)g+=`<line class="${v===0?"zero":"grid"}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+6}" text-anchor="end">${nf.format(v)}</text>`;
  let lab="";for(let i=1;i<=n;i++){const t=xlab(i);if(t!=null)lab+=`<text x="${x(i)}" y="${H-6}" text-anchor="${i===n?"end":(!dots&&i===1)?"start":"middle"}">${esc(t)}</text>`}
  const lines=series.slice().reverse().map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${s.pts.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ")}"/>
    ${dots?s.pts.slice(1).map((v,i)=>`<circle cx="${x(i+1).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="${s.color}"/>`).join(""):`<circle cx="${x(n)}" cy="${y(s.pts[n])}" r="3.5" fill="${s.color}"/>`}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Samlet fortjeneste pr. spiller">${g}${lab}${lines}</svg>`;
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function placeStats(evs){
  const withG=evs.filter(e=>e.games&&e.games.length);
  if(!withG.length)return `<div class="card"><h3>Placeringer</h3><div class="muted">Sejre, fordeling og indbyrdes opgør dukker op her, når der er tastet aftener med placeringer.</div></div>`;
  const P={},maxN=Math.max(...withG.map(e=>e.players.length));const H2H={};
  withG.forEach(ev=>ev.games.forEach(g=>{
    const npr=(ev.prizes||[]).length,full=g.filter(Boolean).length===ev.players.length;
    ev.players.forEach(p=>{const a=P[p]||(P[p]={id:p,games:0,wins:0,itm:0,dist:Array(maxN).fill(0),unk:0,sumPl:0,nFull:0});
      const i=g.indexOf(p);a.games++;if(i===0)a.wins++;if(i>=0&&i<npr)a.itm++;if(i>=0)a.dist[i]++;else a.unk++;if(full&&i>=0){a.sumPl+=i+1;a.nFull++}});
    ev.players.forEach(p=>ev.players.forEach(q=>{if(p===q)return;const ip=g.indexOf(p),iq=g.indexOf(q);
      if(ip>=0&&(iq<0||ip<iq)){(H2H[p]=H2H[p]||{})[q]=(H2H[p][q]||0)+1}}));
  }));
  const rows=Object.values(P).sort((a,b)=>b.wins-a.wins||b.itm/b.games-a.itm/a.games);
  const ids=rows.map(r=>r.id),nG=withG.reduce((s,e)=>s+e.games.length,0);
  let h=`<div class="card"><h3>Placeringer <span class="small muted">· ${nG} spil på ${withG.length} ${withG.length===1?"aften":"aftener"}</span></h3>
    <div class="tbl"><table><thead><tr><th>Spiller</th><th class="num">Spil</th><th class="num">Sejre</th><th class="num">Præmie</th><th class="num">Gns. plads</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(pname(r.id))}</td><td class="num">${r.games}</td><td class="num">${r.wins}</td><td class="num">${pct(r.itm/r.games)}</td><td class="num muted">${r.nFull?(r.sumPl/r.nFull).toLocaleString("da-DK",{maximumFractionDigits:1}):"–"}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="small muted">Præmie = andel af spillene med præmieplads. Gns. plads regnes kun på spil, hvor alle pladser er tastet (fra 2027).</div></div>`;
  h+=`<div class="card"><h3>Hvor tit på hver plads</h3><div class="tbl"><table class="h2h"><thead><tr><th>Spiller</th>${Array.from({length:maxN},(_,i)=>`<th>${i+1}.</th>`).join("")}<th title="Ingen præmie, plads ikke tastet">Ukendt</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(pname(r.id))}</td>${r.dist.map(v=>`<td>${v||"·"}</td>`).join("")}<td class="muted">${r.unk||"·"}</td></tr>`).join("")}</tbody></table></div></div>`;
  h+=`<div class="card"><h3>Hvem ender foran hvem</h3><div class="tbl"><table class="h2h"><thead><tr><th></th>${ids.map(q=>`<th>${esc(pname(q).slice(0,3))}</th>`).join("")}</tr></thead><tbody>
    ${ids.map(p=>`<tr><td>${esc(pname(p))}</td>${ids.map(q=>p===q?`<td class="muted">–</td>`:`<td>${(H2H[p]||{})[q]||0}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="small muted">Læses vandret: antal spil, hvor spilleren i rækken sluttede foran spilleren i kolonnen.</div></div>`;
  return h;
}

/* ---------- Backup ---------- */
function download(name,text,type){
  const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
}
const stamp=()=>new Date().toISOString().slice(0,16).replace("T","_").replace(":","");
function csvRows(){
  const rows=[["Dato","Sæson","Status","Vært","Spiller","Gæst","Spil","Placering","Indskud (kr)","Gevinst (kr)","Netto (kr)","Note"]];
  S.evenings.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(ev=>{
    const base=[ev.date,sname(ev.season),ev.cancelled?"Aflyst":"Spillet",ev.host?pname(ev.host):""];
    if(ev.cancelled){rows.push([...base,"","","","","","","",ev.note||""]);return}
    if(ev.games&&ev.games.length){ev.games.forEach((g,gi)=>ev.players.forEach(p=>{const i=g.indexOf(p),w=i>=0?((ev.prizes||[])[i]||0):0;
      rows.push([...base,pname(p),isGuest(p)?"ja":"",gi+1,i>=0?i+1:"",ev.buyIn,w,w-ev.buyIn,ev.note||""])}))}
    else evResult(ev).forEach(r=>rows.push([...base,pname(r.id),isGuest(r.id)?"ja":"","alle","",r.paid??"",r.won??"",r.net,(ev.note||"")+(ev.results?" (kun netto)":"")]));
  });
  return rows;
}
const toCsv=rows=>"﻿"+rows.map(r=>r.map(v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")).join("\r\n");
function backupJson(){return JSON.stringify({app:"torsdagspoker",version:APP_VERSION,exportedAt:new Date().toISOString(),config:S.settings,players:S.players,evenings:S.raw},null,1)}
async function readRestore(file){
  if(!file)return;
  try{const j=JSON.parse(await file.text());
    if(j.app!=="torsdagspoker"||!Array.isArray(j.evenings)||!Array.isArray(j.players))throw 0;

async function doRestore(){

/* ---------- Ny / ret aften ---------- */
function newDraft(){const c=cfg();return{date:today(),host:"",players:[],games:Array.from({length:c.games},()=>[]),cancelled:false,note:""}}
/* Fra 2027 skal alle pladser tastes. Før det kun præmiepladserne (resten er valgfrie). */
const fullPlaces=d=>(d.date||"")>="2027-01-01";
function syncDraft(){
  const c=cfg(),d=S.draft,n=d.players.length;
  if(!d.games)d.games=[];
  if(!S.editingId)while(d.games.length<c.games)d.games.push([]);
  d.games=d.games.map(g=>Array.from({length:n},(_,i)=>d.players.includes(g[i])?g[i]:""));
}
function draftIssues(){
  const c=cfg(),d=S.draft,n=d.players.length,out=[];
  if(!d.date)out.push("Vælg en dato.");
  if(d.cancelled)return out;
  const pr=c.prizes[String(n)]||[];
  if(n<c.minPlayers)out.push(`Der skal være mindst ${c.minPlayers} spillere (valgt: ${n}).`);
  else if(!pr.length)out.push(`Der er ingen præmier for ${n} spillere. Tilføj dem under Regler og spillere.`);
  const need=fullPlaces(d)?n:pr.length;
  d.games.forEach((g,i)=>{const f=g.filter(Boolean);
    if(g.slice(0,need).some(x=>!x))out.push(need===n?`Spil ${i+1}: vælg alle ${n} placeringer.`:`Spil ${i+1}: vælg 1.–${need}. plads (præmiepladserne).`);
    else if(new Set(f).size!==f.length)out.push(`Spil ${i+1}: samme spiller står på flere pladser.`)});
  return out;
}

  const buyIn=ev&&ev.buyIn?ev.buyIn:c.buyIn, prizes=ev&&ev.players.length===n&&ev.prizes?ev.prizes:pr;

  h+=`<div class="card"><div class="row"><label for="ev-date">Dato<input type="date" id="ev-date" value="${esc(d.date)}"></label>
    <label for="ev-host">Sted (vært)<select id="ev-host"><option value="">Ikke valgt</option>${S.players.filter(p=>!p.guest&&(p.active!==false||p.id===d.host)).map(p=>`<option value="${esc(p.id)}" ${p.id===d.host?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label></div>

    ${d.cancelled?"":`<div><h3>Hvem spiller med?</h3><div class="small muted">Mindst ${c.minPlayers}. Hver betaler ${kr(buyIn)} pr. spil.</div></div>
    <div class="players">${shown.map(p=>`<label class="check"><input type="checkbox" data-player="${esc(p.id)}" ${d.players.includes(p.id)?"checked":""}>${label(p)}</label>`).join("")}</div>`}</div>`;
  if(!d.cancelled&&n>=c.minPlayers&&prizes.length){

      <div class="small muted">${full?"Tast alle pladser, fra vinderen til den, der røg først ud.":"Præmiepladserne skal tastes. De øvrige pladser er valgfrie i 2026 og skal tastes fra 2027."}</div>
      <div class="games">${d.games.map((g,gi)=>`<div class="game"><h3>Spil ${gi+1}</h3>${g.map((sel,pi)=>`<label for="g${gi}p${pi}">${pi+1}. plads · ${pi<prizes.length?kr(prizes[pi]):`<span class="muted">ingen præmie${full?"":" · valgfri"}</span>`}
        <select id="g${gi}p${pi}" data-game="${gi}" data-place="${pi}"><option value="">Vælg spiller</option>${d.players.map(id=>`<option value="${esc(id)}" ${id===sel?"selected":""} ${id!==sel&&g.includes(id)?"disabled":""}>${esc(pname(id))}</option>`).join("")}</select></label>`).join("")}</div>`).join("")}</div></div>`;
    const preview={players:d.players,buyIn,prizes,games:d.games};
    h+=`<div class="card"><h3>Afregning i aften</h3>${settleTable(preview)}</div>`;
  }
  const iss=draftIssues();

    <button class="primary" data-act="save" ${iss.length||S.busy?"disabled":""}>${S.editingId?"Gem ændringer":d.cancelled?"Gem som aflyst":"Gem aften"}</button></div>`;
  el.innerHTML=h;
}
async function saveDraft(){
  const c=cfg(),d=S.draft,n=d.players.length;
  const ev=S.editingId?S.evenings.find(e=>e.id===S.editingId):null;
  const keep=ev&&ev.players.length===n&&ev.prizes;
  const base={date:d.date,host:d.host||null,season:+d.date.slice(0,4),note:(d.note||"").trim()||null,updated_at:new Date().toISOString()};
  const row=d.cancelled
    ?{...base,cancelled:true,note:base.note||"Aflyst",players:[],buy_in:0,game_count:0,prizes:null,games:null,results:null}
    :{...base,cancelled:false,players:[...d.players],buy_in:ev&&ev.buyIn?ev.buyIn:c.buyIn,game_count:d.games.length,
      prizes:keep?[...ev.prizes]:[...(c.prizes[String(n)]||[])],games:d.games.map(g=>{const x=[...g];while(x.length&&!x[x.length-1])x.pop();return x})};
  await write(async()=>{
    const r=S.editingId?await S.sb.from("evenings").update(row).eq("id",S.editingId)
                       :await S.sb.from("evenings").insert({id:newId(),...row});
    if(r.error)throw r.error;
    S.season=row.season;clearDraft();flash(d.cancelled?"Aftenen er gemt som aflyst.":"Aftenen er gemt.");location.hash=d.cancelled?"#aftener":"#merit";
  });
}

async function saveSettings(){
  const num=id=>Math.max(0,parseInt($(id).value,10)||0);
  const c={buyIn:num("#s-buyin"),games:Math.max(1,num("#s-games")),minPlayers:Math.max(2,num("#s-min")),maxPlayers:Math.max(2,num("#s-max")),prizes:{}};
  if(c.maxPlayers<c.minPlayers)c.maxPlayers=c.minPlayers;
  Object.assign(c.prizes,cfg().prizes);
  document.querySelectorAll("[data-prize]").forEach(i=>{const v=i.value.split(/[,;\s]+/).map(x=>parseInt(x,10)).filter(x=>x>0);
    if(v.length)c.prizes[i.dataset.prize]=v;else delete c.prizes[i.dataset.prize]});
  const lv=parseLevels($("#s-levels").value);
  if(!lv){flash("Blindniveauerne kan ikke læses. Skriv ét niveau pr. linje som 10/20, eller 'pause 10'.",true);return}
  c.blinds={minutes:Math.max(1,num("#s-bmin")),stack:$("#s-stack").value.trim(),levels:lv};
  await write(async()=>{const r=await S.sb.from("config").upsert({id:"main",data:c});if(r.error)throw r.error;S.settingsDirty=false;flash("Reglerne er gemt.")});
}

async function setPassword(){

  const {error}=await S.sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});

  S.loginSent=email;renderLogin();
}

function out(){
  if(master)return master;
  const g=audio.createGain(),sh=audio.createWaveShaper(),comp=audio.createDynamicsCompressor(),n=2048,curve=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1;curve[i]=Math.tanh(3*x)/Math.tanh(3)}
  sh.curve=curve;comp.threshold.value=-20;comp.knee.value=0;comp.ratio.value=20;comp.attack.value=0.002;comp.release.value=0.15;
  g.connect(sh).connect(comp).connect(audio.destination);return master=g;
}
function tone(freq,ms,when=0,type="sine",vol=0.35,toFreq){
  if(!audio)return;const t=audio.currentTime+when,d=ms/1000,o=audio.createOscillator(),g=audio.createGain(),v=Math.max(0.0002,vol*SND.vol);
  o.type=type;o.frequency.setValueAtTime(freq,t);if(toFreq)o.frequency.linearRampToValueAtTime(toFreq,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);g.gain.setValueAtTime(v,t+Math.max(0.01,d-0.03));
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(out());o.start(t);o.stop(t+d+0.05);
}

function noise(ms,when=0,vol=0.8,from=4000,to=200){
  if(!audio)return;const t=audio.currentTime+when,d=ms/1000,len=Math.ceil(audio.sampleRate*d),b=audio.createBuffer(1,len,audio.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;

  f.frequency.setValueAtTime(from,t);f.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(vol*SND.vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f).connect(g).connect(out());s.start(t);s.stop(t+d+0.05);

function wobble(freq,ms,when,vol=0.8){
  if(!audio)return;const t=audio.currentTime+when,d=ms/1000,o=audio.createOscillator(),l=audio.createOscillator(),lg=audio.createGain(),g=audio.createGain();

  o.connect(g).connect(out());o.start(t);l.start(t);o.stop(t+d+0.05);l.stop(t+d+0.05);
}

  catch{flash("Lydfilen kunne ikke afspilles. Prøv en mp3- eller m4a-fil.",true)}

    if(rem<=0){

        while(over>=lvlMs(C.level)&&C.level<levels().length-1){over-=lvlMs(C.level);C.level++}
        C.endAt=Date.now()+lvlMs(C.level)-over;saveClock();alarmLevel();
      }else{C.running=false;C.remaining=0;saveClock();alarmLevel();dropAwake()}

function clockAct(a){
  if(a!=="ck-reset")confirmReset=false;
  if(a==="ck-test"){unlockAudio();loadOwn().then(alarmLevel);return}
  if(a==="ck-testwarn"){unlockAudio();alarmWarn();return}
  if(a==="ck-go"){
    unlockAudio();
    if(C.running){C.remaining=C.endAt-Date.now();C.running=false;dropAwake()}
    else{if(remaining()<=0)goLevel(C.level);C.endAt=Date.now()+remaining();C.running=true;C.remaining=null;keepAwake()}
    saveClock();paintClock();
  }
  if(a==="ck-next")goLevel(C.level+1,true);
  if(a==="ck-prev")goLevel(C.level-1,true);
  if(a==="ck-plus"||a==="ck-minus"){const d=a==="ck-plus"?60000:-60000;
    if(C.running)C.endAt=Math.max(Date.now()+1000,C.endAt+d);else C.remaining=Math.max(1000,remaining()+d);
    if(remaining()>60000)C.warned=false;saveClock();paintClock()}
  if(a==="ck-reset"){
    if(!confirmReset){confirmReset=true;paintClock();return}
    confirmReset=false;C={level:0,running:false,endAt:0,remaining:null,warned:false};dropAwake();saveClock();paintClock();
  }
}
function parseLevels(txt){
  const out=[];
  for(const raw of txt.split(/\n/)){const s=raw.trim().toLowerCase();if(!s)continue;
    const p=s.match(/^pause\s*(\d+)?/);if(p){out.push({pause:true,minutes:+(p[1]||10)});continue}
    const n=s.split(/[\/\s,;-]+/).map(x=>parseInt(x.replace(/\./g,""),10)).filter(x=>x>0);
    if(n.length>=2)out.push(n[2]?{sb:n[0],bb:n[1],ante:n[2]}:{sb:n[0],bb:n[1]});else return null}
  return out.length?out:null;
}

  $("#sub").textContent=`Sit & go · ${c.games} spil pr. aften · ${kr(c.buyIn)} pr. spil · mindst ${c.minPlayers} spillere`;
  $("#tab-ny").hidden=!writable();
  document.querySelectorAll("[data-link]").forEach(a=>{if(a.dataset.link===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.querySelectorAll("[data-tab]").forEach(s=>s.classList.toggle("on",s.dataset.tab===t));
  renderLogin();renderMerit();renderEvenings();renderEditor();renderRules();
  if(t==="ur"||!$("#clock"))renderClock();
  if(t==="statistik")renderStats();
  if(t!=="ur")document.title="Torsdagspoker";
}
window.addEventListener("hashchange",()=>{S.confirmDel=null;render();window.scrollTo(0,0)});
/* Ny version? Hent den med det samme (telefonen gemmer ellers den gamle side). */
async function checkVersion(){try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});const v=(await r.text()).trim();if(r.ok&&v&&v!==APP_VERSION&&!location.search.includes("v="+encodeURIComponent(v))&&!S.busy&&!hasSavedDraft()&&!S.settingsDirty&&!C.running)location.replace(location.pathname+"?v="+encodeURIComponent(v)+location.hash)}catch{}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(C.running){keepAwake();clockTick()}if(S.sb&&!S.busy){checkVersion();load()}}});
checkVersion();

$("#login-btn").addEventListener("click",async()=>{
  if(S.session){await S.sb.auth.signOut();return}
  S.showLogin=!S.showLogin;S.loginSent=false;renderLogin();
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a.startsWith("ck-")){clockAct(a);return}
  if(a==="season"){S.season=+b.dataset.y;render();window.scrollTo(0,0)}
  if(a==="st-old"){S.statShowOld=!S.statShowOld;S.streakInfo=null;renderStats();return}
  if(a==="streak"){const k=b.dataset.k;S.streakInfo=S.streakInfo&&S.streakInfo.id===id&&S.streakInfo.k===k?null:{id,k};renderStats();return}
  if(a==="new"){if(!hasSavedDraft()||S.editingId)clearDraft();location.hash="#ny"}
  if(a==="edit"){const ev=S.evenings.find(x=>x.id===id);S.editingId=id;
    S.draft={date:ev.date,host:ev.host||"",players:[...ev.players],games:(ev.games||[]).map(g=>[...g]),cancelled:!!ev.cancelled,note:ev.note||""};
    if(!ev.cancelled&&!S.draft.games.length)S.draft.games=Array.from({length:ev.gameCount||cfg().games},()=>[]);
    persistDraft();location.hash="#ny";}
  if(a==="cancel"){clearDraft();location.hash="#aftener"}
  if(a==="bk-csv"){download(`torsdagspoker_${stamp()}.csv`,toCsv(csvRows()),"text/csv;charset=utf-8");flash("Filen til Google Sheets er hentet.")}
  if(a==="bk-json"){download(`torsdagspoker_backup_${stamp()}.json`,backupJson(),"application/json");flash("Den fulde backup er hentet.")}
  if(a==="bk-restore")doRestore();
  if(a==="bk-restore-no"){S.restore=null;renderRules()}
  if(a==="bk-script"){fetch("backup/google-sheets-backup.gs?t="+Date.now()).then(r=>r.text()).then(t=>navigator.clipboard.writeText(t))
    .then(()=>flash("Scriptet er kopieret. Sæt det ind i Apps Script."),()=>{window.open("backup/google-sheets-backup.gs","_blank");flash("Kunne ikke kopiere automatisk. Scriptet er åbnet i en ny fane – markér alt og kopiér.",true)})}
  if(a==="draft-reset"){clearDraft();renderEditor();flash("Kladden er ryddet.")}
  if(a==="evf"){S.evFilter=b.dataset.f;document.querySelectorAll("[data-act=evf]").forEach(x=>x.classList.toggle("on",x===b));renderEvList()}
  if(a==="del"){S.confirmDel=id;renderEvList()}
  if(a==="del-no"){S.confirmDel=null;renderEvList()}
  if(a==="del-yes")write(async()=>{const r=await S.sb.from("evenings").delete().eq("id",id);if(r.error)throw r.error;S.confirmDel=null;flash("Aftenen er slettet.")});
  if(a==="save")saveDraft();
  if(a==="save-player"){const name=$("#pn-"+CSS.escape(id)).value.trim();if(!name)return;
    const active=$("#pa-"+CSS.escape(id)).checked,guest=$("#pg-"+CSS.escape(id)).checked;
    write(async()=>{const r=await S.sb.from("players").update({name,active,guest}).eq("id",id);if(r.error)throw r.error;flash("Spilleren er gemt.")})}
  if(a==="logout")S.sb.auth.signOut();
  if(a==="send-link")sendLogin();
  if(a==="admin-del"){S.confirmAdmin=b.dataset.email;renderRules()}
  if(a==="admin-del-no"){S.confirmAdmin=null;renderRules()}
  if(a==="admin-del-yes"){const em=b.dataset.email;
    write(async()=>{const r=await S.sb.from("admins").delete().eq("email",em);if(r.error)throw r.error;S.confirmAdmin=null;flash(em+" kan ikke længere taste.")})}
  if(a==="login-close"){S.showLogin=false;S.loginSent=false;renderLogin()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="season"){S.season=t.value==="alle"?"alle":+t.value;render()}
  if(t.id==="ck-sound"){SND.kind=t.value;saveSnd();unlockAudio();if(t.value==="egen"&&!SND.file){$("#ck-file").click();return}loadOwn().then(()=>snd().level(0))}
  if(t.id==="ck-rep"){SND.rep=+t.value;saveSnd()}
  if(t.id==="ck-file")pickOwn(t.files&&t.files[0]);
  if(t.id==="ck-vol"){SND.vol=+t.value;saveSnd();unlockAudio();alarmWarn()}
  if(t.id==="ev-season"){S.evSeason=t.value;renderEvList()}
  if(t.id==="st-season"){S.statSeason=t.value;S.streakInfo=null;renderStats()}
  if(t.id==="ev-date"){S.draft.date=t.value;persistDraft();renderEditor()}
  if(t.id==="ev-host"){S.draft.host=t.value;persistDraft()}
  if(t.id==="ev-cancel"){S.draft.cancelled=t.checked;persistDraft();renderEditor()}
  if(t.id==="ev-note"){S.draft.note=t.value;persistDraft()}
  if(t.id==="restore-file")readRestore(t.files&&t.files[0]);
  if(t.dataset.player){const d=S.draft;d.players=t.checked?[...d.players,t.dataset.player]:d.players.filter(x=>x!==t.dataset.player);persistDraft();renderEditor()}
  if(t.dataset.game!==undefined){S.draft.games[+t.dataset.game][+t.dataset.place]=t.value;persistDraft();renderEditor()}
});
document.addEventListener("toggle",e=>{const m=e.target.dataset&&e.target.dataset.month;if(m&&!S.evQuery.trim())S.openMonths[m]=e.target.open},true);
document.addEventListener("input",e=>{
  if(e.target.closest("#f-settings"))S.settingsDirty=true;
  if(e.target.id==="ev-q"){S.evQuery=e.target.value;renderEvList()}
  if(e.target.id==="ev-note"&&S.draft){S.draft.note=e.target.value;persistDraft()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="f-settings")saveSettings();
  if(e.target.id==="f-login")pwLogin();
  if(e.target.id==="f-pw")setPassword();
  if(e.target.id==="f-admin"){const em=$("#new-admin").value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){flash("Skriv en gyldig mailadresse.",true);return}
    write(async()=>{const r=await S.sb.from("admins").insert({email:em});if(r.error&&r.error.code!=="23505")throw r.error;flash(em+" kan nu taste resultater.")})}
  if(e.target.id==="f-player"){const name=$("#new-player").value.trim();if(!name)return;const guest=$("#new-guest").checked;
    write(async()=>{const r=await S.sb.from("players").insert({id:newId(),name,active:true,guest});if(r.error)throw r.error;flash(name+" er tilføjet.")})}
});

/* ---------- opstart ---------- */
S.restored=restoreDraft();
render();
startTicking();if(C.running)keepAwake();
if(!window.supabase){flash("Siden kunne ikke starte. Tjek forbindelsen og genindlæs.",true)}
else{
  S.sb=window.supabase.createClient(SB_URL,SB_KEY);
  S.sb.auth.onAuthStateChange((_ev,session)=>{S.session=session;if(session){S.showLogin=false;S.loginSent=false}setTimeout(checkAdmin,0)});
  load();
}
</script>
</body>
</html>
