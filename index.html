<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torsdagspoker</title>
<meta name="theme-color" content="#0f4d34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Torsdagspoker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: grøn filt-bånd øverst med titel og faner, derunder én smal kolonne med kort og tabeller. */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --ink:#16201b; --muted:#5b6a62; --line:#d6ddd7;
  --band:#0f4d34; --band-ink:#f4f8f5; --band-muted:#a9c9b8;
  --accent:#0f6a45; --accent-ink:#ffffff; --gain:#12784a; --loss:#b3261e; --gold:#a8760c; --warn-bg:#fdf3dc; --warn-ink:#7a5408;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1310; --surface:#141e19; --ink:#e5ede8; --muted:#92a399; --line:#25332b;
  --band:#0b3324; --band-ink:#eef5f0; --band-muted:#8fb5a1;
  --accent:#43b883; --accent-ink:#06150e; --gain:#4cc28b; --loss:#f07a70; --gold:#e0b04a; --warn-bg:#33270d; --warn-ink:#f1cf7f;
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
header.band .wrap{padding-block:22px 0;display:flex;flex-direction:column;gap:4px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.sub{color:var(--band-muted);font-size:13px}
.login-link{background:none;border:1px solid var(--band-muted);color:var(--band-ink);font-size:13px;padding:6px 10px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:14px}
nav.tabs a{color:var(--band-muted);text-decoration:none;padding:10px 12px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--gold)}
nav.tabs a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main .wrap{padding-block:20px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.gain{color:var(--gain);font-weight:600}.loss{color:var(--loss);font-weight:600}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th.num{text-align:right}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.rank{font-family:var(--display);font-size:20px;font-weight:700;width:34px;color:var(--muted)}
tr.lead .rank{color:var(--gold)}
.leader{display:flex;gap:14px;align-items:center}
.chip{width:46px;height:46px;border-radius:50%;flex:none;background:var(--gold);border:5px dashed var(--surface);box-shadow:0 0 0 2px var(--gold)}
.big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:14px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:110px}
button{font:inherit;font-weight:600;border-radius:7px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--loss)}
button:disabled{opacity:.55;cursor:default}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.game{border:1px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ev-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
@media (max-width:520px){.hide-sm{display:none}}
.clock{align-items:center;text-align:center;gap:6px;padding-block:22px}
.clock .lvl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.clock .blinds{font-family:var(--display);font-weight:700;font-size:clamp(44px,15vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.clock .time{font-family:var(--display);font-weight:700;font-size:clamp(72px,26vw,168px);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock.warn .time{color:var(--gold)}
.clock.over .time{color:var(--loss)}
.clock.pause .blinds{color:var(--accent)}
.clock .next{color:var(--muted);font-size:15px}
.clock .ctl{justify-content:center;margin-top:10px}
.clock .ctl button{min-width:92px}
.clock .go{min-width:150px!important;font-size:18px;padding:12px 18px}
.bar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.clock.warn .bar>i{background:var(--gold)}
tr.cur td{background:var(--bg);font-weight:600}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-height:190px;width:100%;font-variant-numeric:tabular-nums}
[data-tab]{display:none;flex-direction:column;gap:14px}[data-tab].on{display:flex}
@media (prefers-reduced-motion:no-preference){button{transition:filter .15s}button:hover:not(:disabled){filter:brightness(1.06)}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="top">
      <h1>Torsdagspoker</h1>
      <button class="login-link" id="login-btn" type="button">Log ind</button>
    </div>
    <div class="sub" id="sub">Sit &amp; go hver 14. dag</div>
    <nav class="tabs" id="tabs">
      <a href="#merit" data-link="merit">Order of Merit</a>
      <a href="#aftener" data-link="aftener">Aftener</a>
      <a href="#ny" data-link="ny" id="tab-ny">Ny aften</a>
      <a href="#ur" data-link="ur">Blind-ur</a>
      <a href="#regler" data-link="regler">Regler og spillere</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="status" class="notice" hidden></div>
    <section id="login" class="card" hidden></section>
    <section data-tab="merit" id="sec-merit"></section>
    <section data-tab="aftener" id="sec-aftener"></section>
    <section data-tab="ny" id="sec-ny"></section>
    <section data-tab="ur" id="sec-ur"></section>
    <section data-tab="regler" id="sec-regler"></section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Forbindelse. Publishable/anon-nøglen er offentlig og må gerne stå her – adgangen styres af reglerne i databasen. */
const SB_URL="https://wmmdgdpdejqazrginqgp.supabase.co";
const SB_KEY="sb_publishable_IxWJBCmySse3nCVfv2Oyrw_IRtgn_tR";
const APP_VERSION="2026-11-19.7";   // skal matche version.txt – hæves ved hver udgivelse

const DEFAULTS={buyIn:150,games:2,minPlayers:5,maxPlayers:6,prizes:{"5":[450,300],"6":[450,300,150]},
  blinds:{minutes:12,stack:"10 × 10 · 12 × 25 · 12 × 100 · 1 × 500",
    levels:[[10,20],[20,40],[30,60],[50,100],[75,150],[100,200],[200,400],[400,800],[800,1600]].map(([sb,bb])=>({sb,bb}))}};
const S={sb:null,session:null,admins:[],confirmAdmin:null,settings:null,players:[],evenings:[],canWrite:false,loaded:false,
  season:null,draft:null,editingId:null,confirmDel:null,settingsDirty:false,busy:false,showLogin:false,loginSent:false};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("da-DK");
const kr=n=>nf.format(n)+" kr.";
const net=n=>n===0?"0 kr.":(n>0?"+":"−")+nf.format(Math.abs(n))+" kr.";
const netCls=n=>n>0?"gain":n<0?"loss":"";
const fmtDate=d=>{try{return new Date(d+"T12:00").toLocaleDateString("da-DK",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}catch{return d}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const cfg=()=>Object.assign({},DEFAULTS,S.settings||{});
const pname=id=>(S.players.find(p=>p.id===id)||{}).name||"Ukendt";
const writable=()=>S.canWrite===true;
const isGuest=id=>!!(S.players.find(p=>p.id===id)||{}).guest;
const label=p=>esc(p.name)+(p.guest?" (gæst)":"");
const newId=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));

function evResult(ev){
  const paid=(ev.buyIn||0)*(ev.gameCount||(ev.games||[]).length);
  if(ev.results)return Object.entries(ev.results).map(([id,n])=>({id,paid,won:n+paid,wins:0,net:n})).sort((a,b)=>b.net-a.net);
  const m={};(ev.players||[]).forEach(p=>m[p]={id:p,paid,won:0,wins:0});
  (ev.games||[]).forEach(g=>g.forEach((p,i)=>{if(m[p]){m[p].won+=(ev.prizes||[])[i]||0;if(i===0)m[p].wins++}}));
  return Object.values(m).map(r=>({...r,net:r.won-r.paid})).sort((a,b)=>b.net-a.net||b.wins-a.wins);
}
function seasons(){const y=new Set(S.evenings.map(e=>e.season));y.add(new Date().getFullYear());return [...y].sort((a,b)=>b-a)}
function merit(season){
  const t={};
  S.evenings.filter(e=>e.season===season).forEach(ev=>evResult(ev).forEach(r=>{
    const a=t[r.id]||(t[r.id]={id:r.id,n:0,paid:0,won:0,wins:0,net:0});
    a.n++;a.paid+=r.paid;a.won+=r.won;a.wins+=r.wins;a.net+=r.net;}));
  return Object.values(t).sort((a,b)=>b.net-a.net||b.wins-a.wins);
}

/* ---------- Order of Merit ---------- */
function renderMerit(){
  const el=$("#sec-merit");
  if(!S.loaded){el.innerHTML=`<div class="card empty">Henter resultater …</div>`;return}
  const ss=seasons(); if(!ss.includes(S.season))S.season=ss[0];
  const rows=merit(S.season);
  const evs=S.evenings.filter(e=>e.season===S.season);
  const last=evs[0];
  let h=`<div class="row spread"><h2>Order of Merit ${S.season}</h2>
    <label style="flex-direction:row;align-items:center;gap:8px">Sæson
    <select id="season">${ss.map(y=>`<option ${y===S.season?"selected":""}>${y}</option>`).join("")}</select></label></div>`;
  if(!rows.length){el.innerHTML=h+`<div class="card empty">Ingen aftener i ${S.season} endnu.</div>`;return}
  const lead=rows.find(r=>!isGuest(r.id));
  if(lead)h+=`<div class="card"><div class="leader"><div class="chip" aria-hidden="true"></div><div>
    <div class="small muted">Fører efter ${evs.length} ${evs.length===1?"aften":"aftener"}</div>
    <div class="big">${esc(pname(lead.id))}</div>
    <div class="${netCls(lead.net)}">${net(lead.net)}</div></div></div></div>`;
  let rank=0;
  h+=`<div class="card"><div class="tbl"><table><thead><tr><th></th><th>Spiller</th><th class="num">Aftener</th><th class="num hide-sm">Indskud</th><th class="num hide-sm">Gevinst</th><th class="num">Fortjeneste</th><th class="num">Gns.</th></tr></thead><tbody>
  ${rows.map(r=>{const g=isGuest(r.id);if(!g)rank++;
    return `<tr class="${!g&&r===lead?"lead":""}"><td class="rank">${g?"–":rank}</td><td>${esc(pname(r.id))}${g?` <span class="pill">Gæst</span>`:""}</td><td class="num">${r.n}</td><td class="num muted hide-sm">${kr(r.paid)}</td><td class="num hide-sm">${kr(r.won)}</td><td class="num ${netCls(r.net)}">${net(r.net)}</td><td class="num muted">${(r.net/r.n).toLocaleString("da-DK",{maximumFractionDigits:2,minimumFractionDigits:2})}</td></tr>`}).join("")}
  </tbody></table></div><div class="small muted">Fortjeneste = gevinst minus indskud. Gns. = fortjeneste pr. aften spillet. Gæster vises, men får ingen placering og kan ikke vinde året.</div></div>`;
  if(last) h+=`<div class="card"><div class="ev-head"><h3>Seneste aften · ${esc(fmtDate(last.date))}</h3><a href="#aftener" class="small">Alle aftener</a></div>${settleTable(last)}</div>`;
  el.innerHTML=h;
}
function settleTable(ev){
  return `<div class="tbl"><table><thead><tr><th>Spiller</th><th class="num">Betalt</th><th class="num">Får udbetalt</th><th class="num">Netto</th></tr></thead><tbody>
  ${evResult(ev).map(r=>`<tr><td>${esc(pname(r.id))}</td><td class="num muted">${kr(r.paid)}</td><td class="num">${kr(r.won)}</td><td class="num ${netCls(r.net)}">${net(r.net)}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ---------- Aftener ---------- */
function renderEvenings(){
  const el=$("#sec-aftener");
  if(!S.loaded){el.innerHTML=`<div class="card empty">Henter aftener …</div>`;return}
  const evs=S.evenings.filter(e=>e.season===S.season);
  let h=`<div class="row spread"><h2>Aftener ${S.season}</h2>${writable()?`<button class="primary" data-act="new">Ny aften</button>`:""}</div>`;
  if(!evs.length){el.innerHTML=h+`<div class="card empty">Ingen aftener i ${S.season} endnu.</div>`;return}
  h+=evs.map(ev=>{
    const games=(ev.games||[]).map((g,i)=>`<div class="small"><b>Spil ${i+1}:</b> ${g.map((p,j)=>`${j+1}. ${esc(pname(p))}`).join(" · ")}</div>`).join("");
    const pot=(ev.players||[]).length*(ev.buyIn||0);
    const del=S.confirmDel===ev.id
      ?`<span class="small">Slet aftenen permanent?</span><button class="danger" data-act="del-yes" data-id="${esc(ev.id)}">Ja, slet</button><button data-act="del-no">Fortryd</button>`
      :`${ev.results?"":`<button data-act="edit" data-id="${esc(ev.id)}">Ret</button>`}<button class="danger" data-act="del" data-id="${esc(ev.id)}">Slet</button>`;
    return `<article class="card"><div class="ev-head"><h3>${esc(fmtDate(ev.date))}${ev.host?` · hos ${esc(pname(ev.host))}`:""}</h3><span class="pill">${(ev.players||[]).length} spillere · pulje ${kr(pot)} pr. spil</span>${ev.results?`<span class="pill">Fra regnearket</span>`:""}</div>
      ${games}${settleTable(ev)}${writable()?`<div class="row">${del}</div>`:""}</article>`;
  }).join("");
  el.innerHTML=h;
}

/* ---------- Ny / ret aften ---------- */
function newDraft(){const c=cfg();return{date:today(),host:"",players:[],games:Array.from({length:c.games},()=>[])}}
function syncDraft(){
  const c=cfg(),d=S.draft,n=d.players.length,pr=c.prizes[String(n)]||[];
  if(!S.editingId)while(d.games.length<c.games)d.games.push([]);
  d.games=d.games.map(g=>Array.from({length:pr.length},(_,i)=>d.players.includes(g[i])?g[i]:""));
}
function draftIssues(){
  const c=cfg(),d=S.draft,n=d.players.length,out=[];
  if(!d.date)out.push("Vælg en dato.");
  if(n<c.minPlayers)out.push(`Der skal være mindst ${c.minPlayers} spillere (valgt: ${n}).`);
  else if(!c.prizes[String(n)])out.push(`Der er ingen præmier for ${n} spillere. Tilføj dem under Regler og spillere.`);
  d.games.forEach((g,i)=>{if(g.some(x=>!x))out.push(`Spil ${i+1}: vælg alle placeringer.`);
    else if(new Set(g).size!==g.length)out.push(`Spil ${i+1}: samme spiller står på flere pladser.`)});
  return out;
}
function renderEditor(){
  const el=$("#sec-ny");
  if(!writable()){el.innerHTML=`<div class="card empty">Kun formanden kan taste aftener. Log ind øverst til højre, hvis det er dig.</div>`;return}
  if(!S.loaded){el.innerHTML=`<div class="card empty">Henter spillere …</div>`;return}
  if(!S.draft)S.draft=newDraft();
  syncDraft();
  const c=cfg(),d=S.draft,n=d.players.length,pr=c.prizes[String(n)]||[];
  const ev=S.editingId?S.evenings.find(e=>e.id===S.editingId):null;
  const buyIn=ev?ev.buyIn:c.buyIn, prizes=ev&&ev.players.length===n&&ev.prizes?ev.prizes:pr;
  const shown=S.players.filter(p=>p.active!==false||d.players.includes(p.id));
  let h=`<div class="row spread"><h2>${S.editingId?"Ret aften":"Ny aften"}</h2>${S.editingId?`<button data-act="cancel">Fortryd</button>`:""}</div>`;
  if(!S.players.length){el.innerHTML=h+`<div class="card empty">Der er ingen spillere endnu. Opret dem under <a href="#regler">Regler og spillere</a>.</div>`;return}
  h+=`<div class="card"><div class="row"><label for="ev-date">Dato<input type="date" id="ev-date" value="${esc(d.date)}"></label>
    <label for="ev-host">Sted (vært)<select id="ev-host"><option value="">Ikke valgt</option>${S.players.filter(p=>!p.guest&&(p.active!==false||p.id===d.host)).map(p=>`<option value="${esc(p.id)}" ${p.id===d.host?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label></div>
    <div><h3>Hvem spiller med?</h3><div class="small muted">Mindst ${c.minPlayers}. Hver betaler ${kr(buyIn)} pr. spil.</div></div>
    <div class="players">${shown.map(p=>`<label class="check"><input type="checkbox" data-player="${esc(p.id)}" ${d.players.includes(p.id)?"checked":""}>${label(p)}</label>`).join("")}</div></div>`;
  if(n>=c.minPlayers&&prizes.length){
    const pot=n*buyIn,sum=prizes.reduce((a,b)=>a+b,0);
    h+=`<div class="card"><div class="ev-head"><h3>Placeringer</h3><span class="pill">Pulje ${kr(pot)} pr. spil → ${prizes.map(kr).join(" / ")}</span></div>
      ${sum!==pot?`<div class="notice">Præmierne (${kr(sum)}) passer ikke med puljen (${kr(pot)}). Ret dem under Regler og spillere.</div>`:""}
      <div class="games">${d.games.map((g,gi)=>`<div class="game"><h3>Spil ${gi+1}</h3>${g.map((sel,pi)=>`<label for="g${gi}p${pi}">${pi+1}. plads · ${kr(prizes[pi])}
        <select id="g${gi}p${pi}" data-game="${gi}" data-place="${pi}"><option value="">Vælg spiller</option>${d.players.map(id=>`<option value="${esc(id)}" ${id===sel?"selected":""}>${esc(pname(id))}</option>`).join("")}</select></label>`).join("")}</div>`).join("")}</div></div>`;
    const preview={players:d.players,buyIn,prizes,games:d.games.map(g=>g.filter(Boolean))};
    h+=`<div class="card"><h3>Afregning i aften</h3>${settleTable(preview)}</div>`;
  }
  const iss=draftIssues();
  h+=`<div class="row">${iss.length?`<div class="small muted" style="flex:1 1 240px">${iss.map(esc).join("<br>")}</div>`:""}
    <button class="primary" data-act="save" ${iss.length||S.busy?"disabled":""}>${S.editingId?"Gem ændringer":"Gem aften"}</button></div>`;
  el.innerHTML=h;
}

/* ---------- Blind-ur ----------
   Uret kører lokalt på den telefon, der styrer det. Tiden regnes fra et sluttidspunkt (ikke ved at tælle ned),
   så den passer, selv om skærmen har været slukket. Tilstanden gemmes i telefonen og overlever genindlæsning. */
const CK="tp-clock";
let C=(()=>{try{return JSON.parse(localStorage.getItem(CK))||null}catch{return null}})()||{level:0,running:false,endAt:0,remaining:null,warned:false};
let audio=null,wake=null,tickT=null,confirmReset=false;
const levels=()=>cfg().blinds.levels||[];
const lvlMs=i=>{const L=levels()[i];return ((L&&L.pause?L.minutes:cfg().blinds.minutes)||1)*60000};
const fmtT=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const lvlText=L=>!L?"–":L.pause?`Pause ${L.minutes} min`:`${nf.format(L.sb)} / ${nf.format(L.bb)}${L.ante?` · ante ${nf.format(L.ante)}`:""}`;
function saveClock(){try{localStorage.setItem(CK,JSON.stringify(C))}catch{}}
function remaining(){return C.running?C.endAt-Date.now():(C.remaining??lvlMs(C.level))}
/* Lyde laves i telefonen eller kommer fra en lydfil, man selv vælger. Valg, lydstyrke og gentagelser gemmes pr. telefon.
   Alt sendes gennem en forstærker (overstyring + kompressor), så lyden er så høj som telefonen kan. */
const SND=(()=>{try{return JSON.parse(localStorage.getItem("tp-sound"))||{}}catch{return{}}})();
SND.kind=SND.kind&&SND.kind!=="klokke"?SND.kind:"sirene";SND.vol=SND.vol??1;SND.rep=SND.rep||2;
let master=null,ownBuf=null;
function out(){
  if(master)return master;
  const g=audio.createGain(),sh=audio.createWaveShaper(),comp=audio.createDynamicsCompressor(),n=2048,curve=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1;curve[i]=Math.tanh(3*x)/Math.tanh(3)}
  sh.curve=curve;comp.threshold.value=-20;comp.knee.value=0;comp.ratio.value=20;comp.attack.value=0.002;comp.release.value=0.15;
  g.connect(sh).connect(comp).connect(audio.destination);return master=g;
}
function tone(freq,ms,when=0,type="sine",vol=0.35,toFreq){
  if(!audio)return;const t=audio.currentTime+when,d=ms/1000,o=audio.createOscillator(),g=audio.createGain(),v=Math.max(0.0002,vol*SND.vol);
  o.type=type;o.frequency.setValueAtTime(freq,t);if(toFreq)o.frequency.linearRampToValueAtTime(toFreq,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);g.gain.setValueAtTime(v,t+Math.max(0.01,d-0.03));
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(out());o.start(t);o.stop(t+d+0.05);
}
const beep=(f,ms,w=0)=>tone(f,ms,w,"square",0.5);
const bell=(f,w=0,len=1800)=>{tone(f,len,w,"sine",0.8);tone(f*2.76,len*0.5,w,"sine",0.3);tone(f*5.4,len*0.25,w,"sine",0.15)};
const SOUNDS={
  sirene:{name:"🚨 Sirene (kraftig)",len:3.6,level:w=>{for(let i=0;i<3;i++){tone(700,600,w+i*1.2,"sawtooth",0.9,1800);tone(1800,600,w+i*1.2+0.6,"sawtooth",0.9,700);tone(1400,1200,w+i*1.2,"square",0.4,2600)}},
    warn:()=>{tone(900,500,0,"sawtooth",0.8,1800);tone(1800,500,0.5,"sawtooth",0.8,900)}},
  brand:{name:"🔥 Brandalarm (kraftig)",len:3.2,level:w=>{for(let s=0;s<2;s++)for(let i=0;i<3;i++){const t=w+s*1.7+i*0.5;tone(3100,380,t,"square",0.9);tone(3150,380,t,"sawtooth",0.5)}},
    warn:()=>{tone(3100,250,0,"square",0.8);tone(3100,250,0.4,"square",0.8)}},
  horn:{name:"📯 Tågehorn (kraftig)",len:3.4,level:w=>{for(let i=0;i<3;i++)[233,294,349,466].forEach(f=>tone(f,900,w+i*1.15,"sawtooth",0.7))},
    warn:()=>[233,294,349].forEach(f=>tone(f,600,0,"sawtooth",0.6))},
  skoleklokke:{name:"🔔 Skoleklokke (kraftig)",len:3,level:w=>{for(let i=0;i<60;i++)tone(i%2?2400:2700,50,w+i*0.05,"square",0.8)},
    warn:()=>{for(let i=0;i<16;i++)tone(i%2?2400:2700,50,i*0.05,"square",0.7)}},
  alarm:{name:"⏰ Vækkeur",len:2.6,level:w=>{for(let r=0;r<3;r++)for(let i=0;i<6;i++)tone(i%2?2000:2600,70,w+r*0.9+i*0.09,"square",0.85)},
    warn:()=>{for(let i=0;i<6;i++)tone(i%2?2000:2600,70,i*0.09,"square",0.7)}},
  klokke:{name:"Klokke (blød)",len:3.2,level:w=>{bell(880,w);bell(880,w+0.7);bell(1175,w+1.4,2600)},warn:()=>bell(660,0,1200)},
  bip:{name:"Bip",len:2.1,level:w=>{[0,0.45,0.9].forEach(x=>beep(880,350,w+x));beep(1320,700,w+1.35)},warn:()=>{beep(660,180);beep(660,180,0.3)}},
  egen:{name:"🎵 Egen lyd (fil)",get len(){return ownBuf?Math.min(ownBuf.duration,10):3.6},
    level:w=>{if(!ownBuf)return SOUNDS.sirene.level(w);const s=audio.createBufferSource(),g=audio.createGain();s.buffer=ownBuf;g.gain.value=1.4*SND.vol;s.connect(g).connect(out());s.start(audio.currentTime+w);s.stop(audio.currentTime+w+10)},
    warn:()=>SOUNDS.brand.warn()}
};
const snd=()=>SOUNDS[SND.kind]||SOUNDS.sirene;
function saveSnd(){try{localStorage.setItem("tp-sound",JSON.stringify({kind:SND.kind,vol:SND.vol,rep:SND.rep,file:SND.file}))}catch{}}
function alarmLevel(){const s=snd();for(let i=0;i<SND.rep;i++)s.level(i*(s.len+0.5));
  try{navigator.vibrate&&navigator.vibrate([600,200,600,200,600,200,1000])}catch{}}
function alarmWarn(){snd().warn();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch{}}
/* Egen lydfil gemmes i telefonens IndexedDB (ikke i databasen). */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("torsdagspoker",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("files","readwrite");t.objectStore("files").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction("files").objectStore("files").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
const decode=ab=>new Promise((res,rej)=>{const p=audio.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)});
async function loadOwn(){try{if(ownBuf||!audio)return;const ab=await idbGet("own");if(ab)ownBuf=await decode(ab.slice(0))}catch{}}
async function pickOwn(file){
  if(!file)return;if(file.size>8*1024*1024){flash("Lydfilen er for stor. Vælg en under 8 MB.",true);return}
  unlockAudio();
  try{const ab=await file.arrayBuffer();ownBuf=await decode(ab.slice(0));await idbSet("own",ab);
    SND.kind="egen";SND.file=file.name;saveSnd();renderClock();alarmLevel();flash("Egen lyd er gemt på denne telefon.")}
  catch{flash("Lydfilen kunne ikke afspilles. Prøv en mp3- eller m4a-fil.",true)}
}
async function keepAwake(){try{if(C.running&&"wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}}catch{}}
function dropAwake(){try{wake&&wake.release()}catch{}wake=null}
function unlockAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume&&audio.resume();tone(1,10,0,"sine",0.0001);loadOwn()}catch{}}
function goLevel(i,keepRunning){
  const n=levels().length;C.level=Math.min(Math.max(0,i),n-1);C.warned=false;
  const ms=lvlMs(C.level);
  if(keepRunning&&C.running)C.endAt=Date.now()+ms;else{C.remaining=ms}
  saveClock();paintClock();
}
function clockTick(){
  if(C.running){
    let rem=C.endAt-Date.now();
    if(rem<=60000&&rem>0&&!C.warned&&!(levels()[C.level]||{}).pause&&lvlMs(C.level)>90000){C.warned=true;saveClock();alarmWarn()}
    if(rem<=0){
      if(C.level<levels().length-1){
        let over=-rem;C.level++;C.warned=false;                    /* indhent niveauer, hvis skærmen var slukket længe */
        while(over>=lvlMs(C.level)&&C.level<levels().length-1){over-=lvlMs(C.level);C.level++}
        C.endAt=Date.now()+lvlMs(C.level)-over;saveClock();alarmLevel();
      }else{C.running=false;C.remaining=0;saveClock();alarmLevel();dropAwake()}
    }
  }
  paintClock();
}
function startTicking(){if(!tickT)tickT=setInterval(clockTick,250)}
function renderClock(){
  const el=$("#sec-ur"),b=cfg().blinds,L=levels();
  if(C.level>=L.length)C.level=Math.max(0,L.length-1);
  el.innerHTML=`<div class="card clock" id="clock">
      <div class="lvl" id="ck-lvl"></div>
      <div class="blinds" id="ck-blinds"></div>
      <div class="time" id="ck-time" aria-live="off"></div>
      <div class="bar"><i id="ck-bar"></i></div>
      <div class="next" id="ck-next"></div>
      <div class="row ctl"><button data-act="ck-prev" aria-label="Forrige niveau">◀ Forrige</button><button class="primary go" data-act="ck-go" id="ck-go"></button><button data-act="ck-next" aria-label="Næste niveau">Næste ▶</button></div>
      <div class="row ctl"><button data-act="ck-minus">− 1 min</button><button data-act="ck-plus">+ 1 min</button><button data-act="ck-reset" id="ck-reset">Nulstil</button></div>
      <div class="small muted" id="ck-note"></div>
    </div>
    <div class="card"><h3>Lyd</h3>
      <div class="row"><label for="ck-sound" style="flex:1 1 150px">Lyd ved niveauskift<select id="ck-sound">${Object.entries(SOUNDS).map(([k,s])=>`<option value="${k}" ${k===SND.kind?"selected":""}>${s.name}</option>`).join("")}</select></label>
        <label for="ck-rep" style="flex:1 1 110px">Gentag alarmen<select id="ck-rep">${[1,2,3,4].map(n=>`<option value="${n}" ${n===SND.rep?"selected":""}>${n} ${n===1?"gang":"gange"}</option>`).join("")}</select></label>
        <label for="ck-vol" style="flex:1 1 150px">Lydstyrke<input type="range" id="ck-vol" min="0.1" max="1" step="0.1" value="${SND.vol}" style="padding:0"></label></div>
      <div class="row"><button data-act="ck-test">▶ Test niveauskift</button><button data-act="ck-testwarn">▶ Test 1 minut tilbage</button></div>
      <div class="row"><label class="check" for="ck-file" style="cursor:pointer">🎵 Vælg egen lydfil …<input type="file" id="ck-file" accept="audio/*" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none"></label>
        <span class="small muted">${SND.file?`Egen lyd: ${esc(SND.file)}`:"mp3 eller m4a, højst 8 MB. Spilles højst 10 sekunder."}</span></div>
      <div class="small muted">Valget gælder denne telefon. Skru op for <b>medielydstyrken</b> (ikke ringetonen), og på iPhone skal lydkontakten på siden stå på lyd. Højest lyd: læg telefonen på bordet med højttaleren opad, eller kobl en bluetooth-højttaler på.</div>
    </div>
    <div class="card"><div class="ev-head"><h3>Blindstruktur</h3><span class="pill">${b.minutes} min pr. niveau</span></div>
      ${b.stack?`<div class="small">Startstack: <b>${esc(b.stack)}</b>${stackTotal(b.stack)?` = ${nf.format(stackTotal(b.stack))} i chips`:""}</div>`:""}
      <div class="tbl"><table><thead><tr><th>Niveau</th><th>Blinds</th><th class="num">Starter efter</th></tr></thead><tbody>
      ${L.map((x,i)=>{let ms=0;for(let j=0;j<i;j++)ms+=lvlMs(j);return `<tr data-lvl="${i}"><td>${x.pause?"–":levelNo(i)}</td><td>${lvlText(x)}</td><td class="num muted">${Math.round(ms/60000)} min</td></tr>`}).join("")}
      </tbody></table></div>
      <div class="small muted">Uret kører på denne telefon. Lad skærmen være tændt og appen åben, så alarmen kan høres. Strukturen ændres under Regler og spillere.</div></div>`;
  paintClock();
}
const levelNo=i=>levels().slice(0,i+1).filter(x=>!x.pause).length;
function stackTotal(s){let t=0,ok=false;String(s).replace(/(\d+)\s*[x×*]\s*(\d+)/gi,(_,a,b)=>{t+=a*b;ok=true});return ok?t:0}
function paintClock(){
  const box=$("#clock");if(!box)return;
  const L=levels(),cur=L[C.level],rem=remaining(),tot=lvlMs(C.level);
  box.classList.toggle("warn",C.running&&rem<=60000&&rem>0&&!(cur&&cur.pause));
  box.classList.toggle("over",!C.running&&rem<=0&&C.level===L.length-1);
  box.classList.toggle("pause",!!(cur&&cur.pause));
  $("#ck-lvl").textContent=cur&&cur.pause?"Pause":`Niveau ${levelNo(C.level)} af ${L.filter(x=>!x.pause).length}`;
  $("#ck-blinds").textContent=cur?(cur.pause?"Pause":lvlText(cur)):"–";
  $("#ck-time").textContent=fmtT(rem);
  $("#ck-bar").style.width=Math.min(100,Math.max(0,100-rem/tot*100))+"%";
  const nx=L[C.level+1];
  $("#ck-next").textContent=nx?`Næste: ${lvlText(nx)}`:"Sidste niveau";
  $("#ck-go").textContent=C.running?"Pause":(rem<tot&&rem>0?"Fortsæt":"Start");
  $("#ck-reset").textContent=confirmReset?"Ja, nulstil":"Nulstil";
  $("#ck-reset").classList.toggle("danger",confirmReset);
  $("#ck-note").textContent=C.running&&!("wakeLock" in navigator)?"Tip: sæt telefonens autolås til \"Aldrig\", mens I spiller.":"";
  document.querySelectorAll("#sec-ur tr[data-lvl]").forEach(tr=>tr.classList.toggle("cur",+tr.dataset.lvl===C.level));
  if(tab()==="ur")document.title=C.running?`${fmtT(rem)} · ${cur?lvlText(cur):""}`:"Torsdagspoker";
}
function clockAct(a){
  if(a!=="ck-reset")confirmReset=false;
  if(a==="ck-test"){unlockAudio();loadOwn().then(alarmLevel);return}
  if(a==="ck-testwarn"){unlockAudio();alarmWarn();return}
  if(a==="ck-go"){
    unlockAudio();
    if(C.running){C.remaining=C.endAt-Date.now();C.running=false;dropAwake()}
    else{if(remaining()<=0)goLevel(C.level);C.endAt=Date.now()+remaining();C.running=true;C.remaining=null;keepAwake()}
    saveClock();paintClock();
  }
  if(a==="ck-next")goLevel(C.level+1,true);
  if(a==="ck-prev")goLevel(C.level-1,true);
  if(a==="ck-plus"||a==="ck-minus"){const d=a==="ck-plus"?60000:-60000;
    if(C.running)C.endAt=Math.max(Date.now()+1000,C.endAt+d);else C.remaining=Math.max(1000,remaining()+d);
    if(remaining()>60000)C.warned=false;saveClock();paintClock()}
  if(a==="ck-reset"){
    if(!confirmReset){confirmReset=true;paintClock();return}
    confirmReset=false;C={level:0,running:false,endAt:0,remaining:null,warned:false};dropAwake();saveClock();paintClock();
  }
}
function parseLevels(txt){
  const out=[];
  for(const raw of txt.split(/\n/)){const s=raw.trim().toLowerCase();if(!s)continue;
    const p=s.match(/^pause\s*(\d+)?/);if(p){out.push({pause:true,minutes:+(p[1]||10)});continue}
    const n=s.split(/[\/\s,;-]+/).map(x=>parseInt(x.replace(/\./g,""),10)).filter(x=>x>0);
    if(n.length>=2)out.push(n[2]?{sb:n[0],bb:n[1],ante:n[2]}:{sb:n[0],bb:n[1]});else return null}
  return out.length?out:null;
}
const levelsText=L=>L.map(x=>x.pause?`pause ${x.minutes}`:`${x.sb}/${x.bb}${x.ante?"/"+x.ante:""}`).join("\n");

/* ---------- navigation ---------- */
const TABS=["merit","aftener","ny","ur","regler"];
function tab(){const t=location.hash.slice(1);return TABS.includes(t)?t:"merit"}
function render(){
  const t=tab(),c=cfg();
  $("#sub").textContent=`Sit & go · ${c.games} spil pr. aften · ${kr(c.buyIn)} pr. spil · mindst ${c.minPlayers} spillere`;
  $("#tab-ny").hidden=!writable();
  document.querySelectorAll("[data-link]").forEach(a=>{if(a.dataset.link===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.querySelectorAll("[data-tab]").forEach(s=>s.classList.toggle("on",s.dataset.tab===t));
  renderLogin();renderMerit();renderEvenings();renderEditor();renderRules();
  if(t==="ur"||!$("#clock"))renderClock();
  if(t!=="ur")document.title="Torsdagspoker";
}
window.addEventListener("hashchange",()=>{S.confirmDel=null;render();window.scrollTo(0,0)});
/* Ny version? Hent den med det samme (telefonen gemmer ellers den gamle side). */
async function checkVersion(){try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});const v=(await r.text()).trim();if(r.ok&&v&&v!==APP_VERSION&&!location.search.includes("v="+encodeURIComponent(v))&&!S.busy&&!S.draft&&!C.running)location.replace(location.pathname+"?v="+encodeURIComponent(v)+location.hash)}catch{}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(C.running){keepAwake();clockTick()}if(S.sb&&!S.busy){checkVersion();load()}}});
checkVersion();

$("#login-btn").addEventListener("click",async()=>{
  if(S.session){await S.sb.auth.signOut();return}
  S.showLogin=!S.showLogin;S.loginSent=false;renderLogin();
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a.startsWith("ck-")){clockAct(a);return}
  if(a==="new"){S.editingId=null;S.draft=null;location.hash="#ny"}
  if(a==="edit"){const ev=S.evenings.find(x=>x.id===id);S.editingId=id;
    S.draft={date:ev.date,host:ev.host||"",players:[...ev.players],games:(ev.games||[]).map(g=>[...g])};location.hash="#ny";}
  if(a==="cancel"){S.editingId=null;S.draft=null;location.hash="#aftener"}
  if(a==="del"){S.confirmDel=id;renderEvenings()}
  if(a==="del-no"){S.confirmDel=null;renderEvenings()}
  if(a==="del-yes")write(async()=>{const r=await S.sb.from("evenings").delete().eq("id",id);if(r.error)throw r.error;S.confirmDel=null;flash("Aftenen er slettet.")});
  if(a==="save")saveDraft();
  if(a==="save-player"){const name=$("#pn-"+CSS.escape(id)).value.trim();if(!name)return;
    const active=$("#pa-"+CSS.escape(id)).checked,guest=$("#pg-"+CSS.escape(id)).checked;
    write(async()=>{const r=await S.sb.from("players").update({name,active,guest}).eq("id",id);if(r.error)throw r.error;flash("Spilleren er gemt.")})}
  if(a==="logout")S.sb.auth.signOut();
  if(a==="send-link")sendLogin();
  if(a==="admin-del"){S.confirmAdmin=b.dataset.email;renderRules()}
  if(a==="admin-del-no"){S.confirmAdmin=null;renderRules()}
  if(a==="admin-del-yes"){const em=b.dataset.email;
    write(async()=>{const r=await S.sb.from("admins").delete().eq("email",em);if(r.error)throw r.error;S.confirmAdmin=null;flash(em+" kan ikke længere taste.")})}
  if(a==="login-close"){S.showLogin=false;S.loginSent=false;renderLogin()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="season"){S.season=+t.value;render()}
  if(t.id==="ck-sound"){SND.kind=t.value;saveSnd();unlockAudio();if(t.value==="egen"&&!SND.file){$("#ck-file").click();return}loadOwn().then(()=>snd().level(0))}
  if(t.id==="ck-rep"){SND.rep=+t.value;saveSnd()}
  if(t.id==="ck-file")pickOwn(t.files&&t.files[0]);
  if(t.id==="ck-vol"){SND.vol=+t.value;saveSnd();unlockAudio();alarmWarn()}
  if(t.id==="ev-date"){S.draft.date=t.value;renderEditor()}
  if(t.id==="ev-host")S.draft.host=t.value;
  if(t.dataset.player){const d=S.draft;d.players=t.checked?[...d.players,t.dataset.player]:d.players.filter(x=>x!==t.dataset.player);renderEditor()}
  if(t.dataset.game!==undefined){S.draft.games[+t.dataset.game][+t.dataset.place]=t.value;renderEditor()}
});
document.addEventListener("input",e=>{if(e.target.closest("#f-settings"))S.settingsDirty=true});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="f-settings")saveSettings();
  if(e.target.id==="f-login")pwLogin();
  if(e.target.id==="f-pw")setPassword();
  if(e.target.id==="f-admin"){const em=$("#new-admin").value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){flash("Skriv en gyldig mailadresse.",true);return}
    write(async()=>{const r=await S.sb.from("admins").insert({email:em});if(r.error&&r.error.code!=="23505")throw r.error;flash(em+" kan nu taste resultater.")})}
  if(e.target.id==="f-player"){const name=$("#new-player").value.trim();if(!name)return;const guest=$("#new-guest").checked;
    write(async()=>{const r=await S.sb.from("players").insert({id:newId(),name,active:true,guest});if(r.error)throw r.error;flash(name+" er tilføjet.")})}
});

/* ---------- opstart ---------- */
render();
startTicking();if(C.running)keepAwake();
if(!window.supabase){flash("Siden kunne ikke starte. Tjek forbindelsen og genindlæs.",true)}
else{
  S.sb=window.supabase.createClient(SB_URL,SB_KEY);
  S.sb.auth.onAuthStateChange((_ev,session)=>{S.session=session;if(session){S.showLogin=false;S.loginSent=false}setTimeout(checkAdmin,0)});
  load();
}
</script>
